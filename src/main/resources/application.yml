spring:
  application:
    name: inboxpilot
  main:
    # InboxPilot is a CLI-style tool, not a server: the context starts, does its
    # work, and exits. The inventory issues add the adapters that run inside it.
    web-application-type: ${INBOXPILOT_WEB_APPLICATION_TYPE:none}

server:
  address: ${INBOXPILOT_DASHBOARD_ADDRESS:127.0.0.1}
  port: ${INBOXPILOT_DASHBOARD_PORT:8080}

logging:
  level:
    root: INFO
    dev.inboxpilot: INFO
  pattern:
    # Appends the operational context (operation, messageId, attempt, elapsedMs,
    # outcome, failure) that OperationContext puts in the MDC, so a line says
    # which operation and which message it belongs to — issue #5.
    #
    # %X prints only the keys actually present, so the optional ones (a message
    # id and an attempt do not always apply) leave no empty placeholders.
    # %replace moves the block onto its own indented line and drops it entirely
    # when no operation is in progress, keeping startup logs clean.
    #
    # Key order is not stable: Logback backs the MDC with a HashMap, so %X
    # iterates in hash order. Listing the keys individually would fix the order
    # but print an empty `key=` for every absent one, which reads worse. The
    # fields are name=value pairs, so tooling matches on the name, not position.
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-40.40logger{39}){cyan} %clr(-){faint} %m%replace(%X){'^(.+)$', '\n  $1'}%n%wEx"

inboxpilot:
  oauth:
    # Set to true once Gmail credentials are in place (issue #9); credentials
    # are validated only when enabled, so the app runs before OAuth is set up.
    enabled: ${INBOXPILOT_OAUTH_ENABLED:false}
    # Credentials come from the environment — never commit them. See
    # application-example.yml and the README's Configuration section.
    client-id: ${INBOXPILOT_OAUTH_CLIENT_ID:}
    client-secret: ${INBOXPILOT_OAUTH_CLIENT_SECRET:}
    token-store: ${INBOXPILOT_TOKEN_STORE:${user.home}/.inboxpilot/tokens}
    # Least privilege for the v0.2 inventory slice: read-only. gmail.modify is
    # only needed once cleanup (label/archive) ships — add it deliberately in
    # config then, not by default here (issue #9).
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly

  scanning:
    lookback: 365d
    max-messages: 50000
    include-spam: false
    include-trash: false

  batching:
    batch-size: 50
    max-retries: 5
    initial-backoff: 1s
    max-backoff: 60s

  reports:
    output-directory: ${INBOXPILOT_REPORT_DIR:./reports}
    formats:
      - JSON
      - CSV
    overwrite: false

  ai:
    enabled: ${INBOXPILOT_AI_ENABLED:false}
    include-redacted-subject: ${INBOXPILOT_AI_INCLUDE_SUBJECT:false}
    include-label-ids: ${INBOXPILOT_AI_INCLUDE_LABELS:false}
    minimum-automatic-confidence: ${INBOXPILOT_AI_MIN_CONFIDENCE:0.90}

  dashboard:
    enabled: ${INBOXPILOT_DASHBOARD_ENABLED:false}
    rules-file: ${INBOXPILOT_RULES_FILE:./rules.yaml}
    max-preview-bytes: ${INBOXPILOT_DASHBOARD_MAX_PREVIEW_BYTES:1048576}

  checkpoints:
    enabled: true
    file: ${INBOXPILOT_CHECKPOINT_FILE:./.inboxpilot/checkpoint.json}
    interval: 500

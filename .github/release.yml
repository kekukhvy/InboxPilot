changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - 'type: feature'
    - title: Fixes
      labels:
        - 'type: bug'
    - title: Documentation
      labels:
        - 'type: documentation'
    - title: Maintenance
      labels:
        - 'type: chore'
        - dependencies
    - title: Other changes
      labels:
        - '*'

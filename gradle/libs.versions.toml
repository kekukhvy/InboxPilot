# Centralized dependency versions.
# Every version this build resolves is declared here — no version literals in
# build.gradle.kts. See .claude/GUIDELINES.md (no inline literals).

[versions]
java = "21"
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
archunit = "1.4.2"
google-oauth-client = "1.39.0"
google-api-client = "2.9.0"
google-api-services-gmail = "v1-rev20220404-2.0.0"

[libraries]
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
assertj-core = { module = "org.assertj:assertj-core" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
google-oauth-client-jetty = { module = "com.google.oauth-client:google-oauth-client-jetty", version.ref = "google-oauth-client" }
google-api-client = { module = "com.google.api-client:google-api-client", version.ref = "google-api-client" }
google-api-services-gmail = { module = "com.google.apis:google-api-services-gmail", version.ref = "google-api-services-gmail" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
